# electron-builder configuration for the desktop app (`npm run desktop:build`).
#
# The package is the Expo web export in dist/ plus the Electron main process
# in desktop/. Nothing from node_modules is needed at runtime — the renderer
# is a single Metro bundle and the main process uses only Node and Electron —
# so the production dependency tree (the whole React Native install) is kept
# out of the asar with the `!node_modules/**` pattern below.
#
# The product is called "SMS" on purpose: security mode disguises the app as
# a messaging app, and the launcher label has to match. The executable, the
# package and the data directory are all `simple-multisig`.

appId: nz.onesandzeros.simplemultisig
productName: SMS
executableName: simple-multisig
copyright: Copyright © Ones and Zeros Technology Limited
artifactName: simple-multisig-${version}-${os}-${arch}.${ext}

# package.json's `main` stays index.ts for Expo; the packaged app starts at
# desktop/main.js. `homepage` is what the deb's control file needs, and
# `desktopName` is what Electron uses as the window's app_id on Linux.
extraMetadata:
  main: desktop/main.js
  description: Simple Multisig wallet
  homepage: https://github.com/onesandzeros-nz/simple-multisig-wallet
  desktopName: simple-multisig.desktop

directories:
  output: dist-desktop
  buildResources: desktop/build

files:
  - desktop/**/*
  - "!desktop/smoke.mjs"
  - "!desktop/launch.js"
  - "!desktop/build/**"
  - dist/**/*
  - package.json
  # electron-builder copies production dependencies through a separate
  # collector; this negative pattern is what that collector honours.
  - "!node_modules/**"

asar: true
npmRebuild: false
publish: null

# Electron fuses (https://www.electronjs.org/docs/latest/tutorial/fuses):
# the packaged binary cannot run as plain Node, ignores NODE_OPTIONS, loads
# its app only from the asar and checks the asar's hash (macOS and Windows).
# enableNodeCliInspectArguments is left at its default (on) on purpose: the
# smoke test drives the packaged binary through Playwright, which attaches
# to the main process with --inspect. A debugger can therefore be attached
# to the running app by whoever can already run it as you; the other fuses
# are what stop it being used as a general-purpose Node.
# resetAdHocDarwinSignature re-signs the flipped binary ad hoc so an
# unsigned build still starts on Apple silicon.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true

linux:
  target:
    - AppImage
    - deb
  category: Finance
  icon: desktop/build/icon.png
  maintainer: Ones and Zeros Technology Limited
  vendor: Ones and Zeros Technology Limited
  description: Simple Multisig wallet
  synopsis: Simple Multisig wallet
  # The .desktop file is named after desktopName above, so it matches the
  # running window's WM_CLASS and the dock shows the right icon.
  syncDesktopName: true
  desktop:
    entry:
      Name: SMS
      Comment: Simple Multisig wallet

  # The hardware wallet udev rule travels with every Linux package; the .deb
  # installs it (scripts below), and the README says how to for an AppImage.
  extraResources:
    - from: desktop/build/linux/70-simple-multisig-hardware-wallets.rules
      to: udev/70-simple-multisig-hardware-wallets.rules

deb:
  packageName: simple-multisig
  # electron-builder's own scripts (symlink, chrome-sandbox, AppArmor profile)
  # with the udev rule for hardware wallets added on.
  afterInstall: desktop/build/linux/after-install.tpl
  afterRemove: desktop/build/linux/after-remove.tpl

appImage: {}

win:
  target:
    - nsis
    - portable
  icon: desktop/build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

portable:
  # Both Windows targets are .exe files; without a distinct name the
  # portable build would overwrite the installer.
  artifactName: simple-multisig-${version}-${os}-${arch}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.finance
  icon: desktop/build/icon.png
  hardenedRuntime: true
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Scan QR codes from hardware wallets to import keys.
  # Signing happens only when CSC_LINK and CSC_KEY_PASSWORD are set, and
  # notarization only when, in addition, APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  # + APPLE_TEAM_ID (or APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER)
  # are. Without them the build is unsigned and un-notarized.

dmg: {}
